name: Build and release TinyCC
on:
  workflow_dispatch:
  schedule:
    # Daily gate avoids the uneven intervals of "*/5" in the day-of-month field.
    - cron: '0 3 * * *'
permissions:
  contents: write
concurrency:
  group: tinycc-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check five-day interval
        id: interval
        shell: pwsh
        run: |
          $due = $true
          if ('${{ github.event_name }}' -eq 'schedule') {
            $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>$null
            if ($LASTEXITCODE -eq 0) {
              $published = [DateTimeOffset]::Parse(($release | ConvertFrom-Json).published_at)
              $due = ([DateTimeOffset]::UtcNow - $published).TotalDays -ge 5
            }
          }
          "due=$($due.ToString().ToLower())" >> $env:GITHUB_OUTPUT
      - name: Build complete distribution
        if: steps.interval.outputs.due == 'true'
        shell: powershell
        run: ./build.ps1
      - name: Publish tested distribution
        if: steps.interval.outputs.due == 'true'
        shell: pwsh
        run: |
          $info = Get-Content bin/build-info.json -Raw | ConvertFrom-Json
          $date = [DateTimeOffset]::Parse($info.builtUtc).UtcDateTime.ToString('yyyy-MM-dd')
          $tag = $date
          @"
          Complete portable TinyCC for Windows: x64, x86 and ARM64.
          Extract the ZIP and use tcc.exe. Headers, libraries and obfh-update.cmd are included.
          "@ | Set-Content release-notes.md
          gh release view $tag >$null 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/*.zip dist/*.sha256 --clobber
            if ($LASTEXITCODE) { throw 'Release upload failed.' }
            gh release edit $tag --title "TinyCC $($info.version) - $date" --notes-file release-notes.md --latest
          } else {
            gh release create $tag dist/*.zip dist/*.sha256 --title "TinyCC $($info.version) - $date" --notes-file release-notes.md --latest
          }
          if ($LASTEXITCODE) { throw 'Release publication failed.' }
