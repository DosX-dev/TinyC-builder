name: Build and release TinyCC
on:
    workflow_dispatch:
    schedule:
        # Daily check at 06:17 Moscow; enforce seven days between releases.
        - cron: "17 3 * * *"
permissions:
    contents: write
concurrency:
    group: tinycc-release
    cancel-in-progress: false
jobs:
    build:
        runs-on: windows-latest
        timeout-minutes: 15
        env:
            GH_TOKEN: ${{ github.token }}
            GITHUB_TOKEN: ${{ github.token }}
            CI: "true"
        steps:
            - uses: actions/checkout@v4
            - name: Check seven-day interval
              id: interval
              shell: pwsh
              run: |
                  $due = $true
                  if ('${{ github.event_name }}' -eq 'schedule') {
                    $response = gh api "repos/$env:GITHUB_REPOSITORY/releases/latest" 2>&1
                    if ($LASTEXITCODE -eq 0) {
                      $published = [DateTimeOffset]::Parse(($response | ConvertFrom-Json).published_at)
                      $due = ([DateTimeOffset]::UtcNow - $published).TotalDays -ge 7
                    } elseif (($response -join "`n") -notmatch 'HTTP 404') {
                      throw 'Could not check the latest release. Publication stopped.'
                    }
                  }
                  "due=$($due.ToString().ToLower())" >> $env:GITHUB_OUTPUT
            - name: Build complete distribution
              if: steps.interval.outputs.due == 'true'
              shell: powershell
              run: ./build.ps1
            - name: Check builder recovery and process handling
              if: steps.interval.outputs.due == 'true'
              shell: powershell
              run: ./tests/builder.ps1
            - name: Pack and check optional UPX distribution
              if: steps.interval.outputs.due == 'true'
              shell: powershell
              run: ./scripts/pack-upx.ps1
            - name: Publish tested distribution
              if: steps.interval.outputs.due == 'true'
              shell: pwsh
              run: |
                  $info = Get-Content bin/build-info.json -Raw | ConvertFrom-Json
                  $date = [DateTimeOffset]::Parse($info.builtUtc).UtcDateTime.ToString('yyyy-MM-dd')
                  $tag = $date
                  $archive = "dist/tinycc-windows-$date.zip"
                  $packed = "dist/tinycc-windows-upx-$date.zip"
                  $assets = @($archive, "$archive.sha256", $packed, "$packed.sha256")
                  foreach ($zip in @($archive, $packed)) {
                    $checksum = "$zip.sha256"
                    if (-not (Test-Path -LiteralPath $zip) -or -not (Test-Path -LiteralPath $checksum)) {
                      throw 'A tested release archive or checksum is missing.'
                    }
                    $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
                    if ($expected -notmatch '^[0-9a-f]{64}$' -or (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLower() -ne $expected) {
                      throw "Release archive checksum mismatch: $zip"
                    }
                  }
                  @"
                  Complete portable TinyCC for Windows: x64, x86 and ARM64.
                  Extract the ZIP and use tcc.exe. Headers, libraries and obfh-update.cmd are included.
                  Choose the standard ZIP or the UPX ZIP for smaller compiler EXEs and DLLs.
                  "@ | Set-Content release-notes.md
                  $response = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" 2>&1
                  if ($LASTEXITCODE -eq 0) {
                    # A same-day rebuild must not overwrite a published release piecemeal.
                    $tag = "$date-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
                  } elseif (($response -join "`n") -notmatch 'HTTP 404') {
                    throw 'Could not check the release. Publication stopped.'
                  }
                  gh release create $tag @assets --target $env:GITHUB_SHA --title "TinyCC $($info.version) - $date" --notes-file release-notes.md --draft
                  if ($LASTEXITCODE) { throw 'Release upload failed; any draft remains unpublished.' }
                  gh release edit $tag --draft=false --latest
                  if ($LASTEXITCODE) { throw 'Release publication failed.' }
            - name: Keep the three latest published releases
              if: steps.interval.outputs.due == 'true'
              shell: pwsh
              run: |
                  $response = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp
                  if ($LASTEXITCODE) { throw 'Could not list releases for cleanup.' }
                  $pages = $response | ConvertFrom-Json
                  $releases = @($pages | ForEach-Object { $_ } | Where-Object { -not $_.draft })
                  $obsolete = @($releases | Sort-Object { [DateTimeOffset]::Parse($_.published_at) } -Descending | Select-Object -Skip 3)
                  foreach ($release in $obsolete) {
                    gh api --method DELETE "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)"
                    if ($LASTEXITCODE) { throw "Could not delete old release $($release.tag_name)." }
                  }
